    <meta charset="UTF-8" />

      The page that draws a diagram in a reply (0.770, src/diagramPage.ts). Loaded in a view no one sees; the

    />
    <title>Locust diagrams</title>
  </head>
  <body>
    <script type="module" src="/src/diagramPage.ts"></script>
  </body>
</html>
